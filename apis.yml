apis:
- aid: dxfeed:dxfeed-rest-api
  name: dxFeed REST Web Service API
  tags:
  - Market Data
  - REST
  - Server-Sent Events
  - Quotes
  - Trades
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://kb.dxfeed.com/en/market-data-api/data-access-solutions/rest.html
  baseURL: https://demo.dxfeed.com/webservice/rest
  properties:
  - url: https://kb.dxfeed.com/en/market-data-api/data-access-solutions/rest.html
    type: Documentation
  - url: https://demo.dxfeed.com/webservice/rest/help
    type: APIReference
  - url: https://tools.dxfeed.com/webservice/rest-demo.jsp
    type: Sandbox
  description: REST service over the core dxFeed API with /events (snapshot), /eventSource
    (Server-Sent Events stream), /addSubscription, and /removeSubscription resources
    across 20+ market event types (Quote, Trade, Profile, Candle, Greeks, Order, Series)
    in JSON or XML. A public demo endpoint serves delayed data; production hosts and
    credentials are issued during sales onboarding.
- aid: dxfeed:dxfeed-dxlink-websocket-api
  name: dxFeed dxLink WebSocket API
  tags:
  - WebSocket
  - Streaming
  - Real-Time
  - Market Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://kb.dxfeed.com/en/market-data-api/data-access-solutions/websocket.html
  baseURL: wss://demo.dxfeed.com/dxlink-ws
  properties:
  - url: https://kb.dxfeed.com/en/market-data-api/data-access-solutions/websocket.html
    type: Documentation
  - url: asyncapi/dxfeed-dxlink-asyncapi.yml
    type: AsyncAPI
  - url: https://demo.dxfeed.com/market-data/dxlink-ws/debug/
    type: Sandbox
  - url: https://github.com/dxFeed/dxLink
    type: GitHubRepository
  description: dxLink is dxFeed's WebSocket protocol for real-time market data streaming
    with multiplexed virtual channels, authorization, and FEED/DOM (order book) service
    channels. The protocol is publicly specified as an AsyncAPI 2.4 document in the
    dxFeed/dxLink GitHub repository, with a live demo server (wss://demo.dxfeed.com/dxlink-ws)
    and an interactive debug console; client SDKs exist for JavaScript, Java, .NET,
    C++, and Swift.
- aid: dxfeed:dxfeed-ipf-webservice
  name: dxFeed Instrument Profile (IPF) Web Service
  tags:
  - Reference Data
  - Instruments
  - Symbology
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://kb.dxfeed.com/en/data-model/reference-data/ipf-webservice.html
  baseURL: https://tools.dxfeed.com/ipf
  properties:
  - url: https://kb.dxfeed.com/en/data-model/reference-data/ipf-webservice.html
    type: Documentation
  description: Reference-data web service for requesting instrument profiles in dxFeed's
    Instrument Profile Format (IPF), including live incremental updates, covering
    the 3.5M instruments in the dxFeed symbology universe. The documented host
    (https://tools.dxfeed.com/ipf) requires customer credentials (HTTP 401 without
    entitlements).
- aid: dxfeed:dxfeed-fundamentals-api
  name: dxFeed Fundamentals API
  tags:
  - Fundamentals
  - Equities
  - Morningstar
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://kb.dxfeed.com/en/data/fundamentals.html
  baseURL: https://tools.dxfeed.com/fs
  properties:
  - url: https://kb.dxfeed.com/en/data/fundamentals.html
    type: Documentation
  - url: openapi/dxfeed-fundamentals-openapi.json
    type: OpenAPI
  - url: overlays/dxfeed-fundamentals-overlay.yaml
    type: Overlay
  - url: mcp/dxfeed-mcp.yml
    type: MCPServer
  - url: data-model/dxfeed-data-model.yml
    type: DataModel
  description: Fundamental equity data sourced from Morningstar and Borsa Istanbul
    for ~45,000 companies - financial statements, valuations, dividends, earnings
    ratios, insider trading, corporate calendars - 28 datasets sharing a uniform
    /recent/symbol, /symbol, and /filter resource pattern, delivered as JSON from
    tools.dxfeed.com/fs (plus regional Morningstar hosts). The OpenAPI 3.1.0 spec
    (176 paths, 269 operations) is publicly served at tools.dxfeed.com/fs/v3/api-docs
    and harvested into this repository; production calls remain entitlement-gated.
- aid: dxfeed:dxfeed-fix-api
  name: dxFeed FIX API
  tags:
  - FIX
  - Market Data
  - Trading Systems
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://kb.dxfeed.com/en/market-data-api/data-access-solutions/fix.html
  properties:
  - url: https://kb.dxfeed.com/en/market-data-api/data-access-solutions/fix.html
    type: Documentation
  description: Industry-standard FIX protocol access to dxFeed market data for trading
    systems. Session endpoints and credentials are provisioned during onboarding;
    no public FIX gateway host is documented.
- aid: dxfeed:dxfeed-historical-data-services
  name: dxFeed Historical Data Services
  tags:
  - Historical Data
  - Tick Data
  - Candles
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://kb.dxfeed.com/en/data-services/historical-services.html
  properties:
  - url: https://kb.dxfeed.com/en/data-services/historical-services.html
    type: Documentation
  description: Historical data access covering candle/aggregated data and raw tick
    data extraction (dxFeed stores up to 10TB of raw data per day). The knowledge
    base documents how to request tick data and read extracted files; access hosts
    and credentials are entitlement-managed and issued by sales.
