aid: dxfeed
url: https://raw.githubusercontent.com/api-evangelist/dxfeed/refs/heads/main/apis.yml
name: dxFeed
kind: company
description: dxFeed is a market data distributor and subsidiary of Devexperts, headquartered
  in Munich, delivering real-time, delayed, historical, and on-demand financial market
  data across equities, ETFs, futures, options, indices, FX, fixed income, and crypto
  (3.5M instruments, ~200,000 simultaneous streaming clients), plus reference data
  (instrument profiles, corporate actions, trading schedules), Morningstar-sourced
  fundamentals, options analytics, and news feeds. Delivery is developer-documented
  but sales-gated - production credentials (endpoint URLs, login, password) arrive
  via onboarding after contacting sales - across a REST web service with Server-Sent
  Events streaming, the dxLink WebSocket protocol (public AsyncAPI spec and live demo
  endpoint), a binary QD protocol over TCP, FIX, file-based historical/tick data
  extraction, and Java/C++/.NET/Swift/Go/JavaScript/Python client libraries.
