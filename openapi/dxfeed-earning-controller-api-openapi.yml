openapi: 3.2.0
info:
  title: dxFeed Fundamentals Earning Controller API
  description: '* [dxFeed Website](https://www.dxfeed.com/)

    * [Knowledge Base: Fundamentals](https://kb.dxfeed.com/en/data/fundamentals.html)

    * [Customer Ticket Portal](https://portal.dxfeed.com/)

    * [Contact the dxFeed sales team](https://dxfeed.com/contact-sales/)

    '
servers:
- url: https://tools.dxfeed.com/fs
  description: Generated server url
tags:
- name: earning-controller
paths:
  /v0.1/earning/recent/snapshot:
    get:
      tags:
      - earning-controller
      operationId: getRecentSnapshot_15
      parameters:
      - name: symbols
        in: query
        description: Filter out the results based on symbols.
        required: true
        schema:
          type: array
          items:
            type: string
          uniqueItems: true
      - name: countryCodes
        in: query
        description: Filter out the results based on country codes from Instrument Reference. ISO three-character code.
        required: false
        schema:
          type: array
          items:
            type: string
          uniqueItems: true
      - name: mics
        in: query
        description: Filter out the results based on instrument mic (Market Identifier Code) codes from Instrument Reference.
        required: false
        schema:
          type: array
          items:
            type: string
          uniqueItems: true
      - name: sources
        in: query
        description: Filter out the results based on available data providers. Skipping this parameter will return an empty response unless you are using the <b>BLENDED</b> source.
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - MORNINGSTAR
            - EDI
            - MSWEB
            - VERDA
            - DXFINA
            - DXFEED
            - TEW
            - CMC
          uniqueItems: true
      - name: Accept-Encoding
        in: header
        description: Requests to /recent paths must use Accept-Encoding gzip compression
        required: true
        schema:
          enum:
          - gzip
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        '406':
          description: Not Acceptable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Map'
    post:
      tags:
      - earning-controller
      operationId: postRecentSnapshot_15
      parameters:
      - name: Accept-Encoding
        in: header
        description: Requests to /recent paths must use Accept-Encoding gzip compression
        required: true
        schema:
          enum:
          - gzip
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecentSnapshotFilterParam'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
