        required: true
        schema:
          enum:
          - gzip
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecentHistoryFilterParams'
        required: true
      responses:
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        '406':
          description: Not Acceptable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
