components:
  schemas:
    Ext:
      type: object
    ApiError:
      type: object
      properties:
        httpStatus:
          type: string
          enum:
          - 100 CONTINUE
          - 101 SWITCHING_PROTOCOLS
          - 102 PROCESSING
          - 103 EARLY_HINTS
          - 103 CHECKPOINT
          - 200 OK
          - 201 CREATED
          - 202 ACCEPTED
          - 203 NON_AUTHORITATIVE_INFORMATION
          - 204 NO_CONTENT
          - 205 RESET_CONTENT
          - 206 PARTIAL_CONTENT
          - 207 MULTI_STATUS
          - 208 ALREADY_REPORTED
          - 226 IM_USED
          - 300 MULTIPLE_CHOICES
          - 301 MOVED_PERMANENTLY
          - 302 FOUND
          - 302 MOVED_TEMPORARILY
          - 303 SEE_OTHER
          - 304 NOT_MODIFIED
          - 305 USE_PROXY
          - 307 TEMPORARY_REDIRECT
          - 308 PERMANENT_REDIRECT
          - 400 BAD_REQUEST
          - 401 UNAUTHORIZED
          - 402 PAYMENT_REQUIRED
          - 403 FORBIDDEN
          - 404 NOT_FOUND
          - 405 METHOD_NOT_ALLOWED
          - 406 NOT_ACCEPTABLE
          - 407 PROXY_AUTHENTICATION_REQUIRED
          - 408 REQUEST_TIMEOUT
          - 409 CONFLICT
          - 410 GONE
          - 411 LENGTH_REQUIRED
          - 412 PRECONDITION_FAILED
          - 413 PAYLOAD_TOO_LARGE
          - 413 REQUEST_ENTITY_TOO_LARGE
          - 414 URI_TOO_LONG
          - 414 REQUEST_URI_TOO_LONG
          - 415 UNSUPPORTED_MEDIA_TYPE
          - 416 REQUESTED_RANGE_NOT_SATISFIABLE
          - 417 EXPECTATION_FAILED
          - 418 I_AM_A_TEAPOT
          - 419 INSUFFICIENT_SPACE_ON_RESOURCE
          - 420 METHOD_FAILURE
          - 421 DESTINATION_LOCKED
          - 422 UNPROCESSABLE_ENTITY
          - 423 LOCKED
          - 424 FAILED_DEPENDENCY
          - 425 TOO_EARLY
          - 426 UPGRADE_REQUIRED
          - 428 PRECONDITION_REQUIRED
          - 429 TOO_MANY_REQUESTS
          - 431 REQUEST_HEADER_FIELDS_TOO_LARGE
          - 451 UNAVAILABLE_FOR_LEGAL_REASONS
          - 500 INTERNAL_SERVER_ERROR
          - 501 NOT_IMPLEMENTED
          - 502 BAD_GATEWAY
          - 503 SERVICE_UNAVAILABLE
          - 504 GATEWAY_TIMEOUT
          - 505 HTTP_VERSION_NOT_SUPPORTED
          - 506 VARIANT_ALSO_NEGOTIATES
          - 507 INSUFFICIENT_STORAGE
          - 508 LOOP_DETECTED
          - 509 BANDWIDTH_LIMIT_EXCEEDED
          - 510 NOT_EXTENDED
          - 511 NETWORK_AUTHENTICATION_REQUIRED
        timestamp:
          type: string
        messages:
          type: array
          items:
            type: string
        exMessage:
          type: string
    FundamentalIdentityObject:
      type: object
      discriminator:
        propertyName: name
      properties:
        dxSymbol:
          type: string
        source:
          type: string
          enum:
          - MORNINGSTAR
          - EDI
          - MSWEB
          - VERDA
          - DXFINA
          - DXFEED
          - TEW
          - CMC
        disabled:
          type: boolean
        eventTime:
          type: integer
          format: int64
        sid:
          type: string
        ext: {}
        id:
          type: integer
          format: int64
        extHash:
          type: string
          format: uuid
        name:
          type: string
      required:
      - name
    RecentHistoryFilterParams:
      type: object
      properties:
        mics:
          type: array
          items:
            type: string
          uniqueItems: true
        symbols:
          type: array
          items:
            type: string
          uniqueItems: true
        sources:
          type: array
          items:
            type: string
            enum:
            - MORNINGSTAR
            - EDI
            - MSWEB
            - VERDA
            - DXFINA
            - DXFEED
            - TEW
            - CMC
          uniqueItems: true
        countryCodes:
          type: array
          items:
            type: string
          uniqueItems: true
        fromYmd:
          type: string
          description: request from date in yyyymmdd format, inclusive
        toYmd:
          type: string
          description: request to date in yyyymmdd format, inclusive
    Earning:
      type: object
      properties:
        ymd:
          type: integer
          format: int32
        eventTime:
          type: integer
          format: int64
        dxSymbol:
          type: string
        sid:
          type: string
        cid:
          type: string
        referencePeriod:
          type: string
        announceType:
          type: string
          enum:
          - UNKNOWN
          - COMPANY_MEETING
          - CONFERENCE_CALL
          - RELEASE
          - ANNUAL_RESULTS
        eps:
          type: number
          format: double
        reportedDilutedEpsFinal:
          type: number
          format: double
        adjustedDilutedEpsFinal:
          type: number
          format: double
        reportedDilutedEpsPreliminary:
          type: number
          format: double
        adjustedDilutedEpsPreliminary:
          type: number
          format: double
        estimatedEPS:
          type: number
          format: double
        announceTime:
          type: string
          enum:
          - UNKNOWN
          - PRE_MARKET
          - POST_MARKET
        startTime:
          type: integer
          format: int64
        endTime:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - UNKNOWN
          - CONFIRMED
          - ESTIMATED
        currencyCode:
          type: string
        ext:
          $ref: '#/components/schemas/Ext'
        disabled:
          type: boolean
        source:
          type: string
          enum:
          - MORNINGSTAR
          - EDI
          - MSWEB
          - VERDA
          - DXFINA
          - DXFEED
          - TEW
          - CMC
        id:
          type: integer
          format: int64
        extHash:
          type: string
          format: uuid
    RecentSnapshotFilterParam:
      type: object
      properties:
        mics:
          type: array
          items:
            type: string
          uniqueItems: true
        symbols:
          type: array
          items:
            type: string
          uniqueItems: true
        sources:
          type: array
          items:
            type: string
            enum:
            - MORNINGSTAR
            - EDI
            - MSWEB
            - VERDA
            - DXFINA
            - DXFEED
            - TEW
            - CMC
          uniqueItems: true
        countryCodes:
          type: array
          items:
            type: string
          uniqueItems: true
    Map:
      type: object
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/FundamentalIdentityObject'
    HistoryFilterParams:
      type: object
      properties:
        mics:
          type: array
          items:
            type: string
          uniqueItems: true
        symbols:
          type: array
          items:
            type: string
          uniqueItems: true
        sources:
          type: array
          items:
            type: string
            enum:
            - MORNINGSTAR
